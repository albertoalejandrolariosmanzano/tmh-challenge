global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Métricas de Prometheus mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Métricas de cAdvisor (todos los contenedores)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    scrape_interval: 10s

  # Si tu API exporta métricas de Prometheus (como vimos antes)
  - job_name: 'api'
    static_configs:
      - targets: ['api:8088']  # Ajusta el puerto según tu API
    metrics_path: /metrics
    scrape_interval: 5s

  # Métricas de PostgreSQL (opcional, necesitas exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alerts.yml'